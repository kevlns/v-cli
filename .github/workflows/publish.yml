name: publish

# 推 v* 标签时发布到 npm。
# 前置：1) 移除 package.json 中的 "private": true  2) 仓库 Settings > Secrets 配置 NPM_TOKEN
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install deps
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Check publish readiness
        id: ready
        run: |
          if grep -q '"private": true' package.json; then
            echo "ready=false (package.json 仍为 private)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "ready=false (未配置 NPM_TOKEN)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.ready.outputs.ready == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
