name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build, typecheck and test
        run: npm run check
      - name: Package install smoke (global install + run)
        run: npm run test:package
      - name: Check whether version already exists
        id: release
        shell: bash
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$package@$version already exists; skipping publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm Trusted Publishing
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            npm publish --tag beta
          else
            npm publish
          fi
